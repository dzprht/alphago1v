{% extends "base.html" %}
{% block title %}Вход — Альфа Защита{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="page-heading"><h1>Вход</h1></div>
    <div class="panel">
        {% if error %}<p class="notice notice--error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit">Войти</button>
        </form>
    </div>
    <p>Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
