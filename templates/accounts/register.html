{% extends "base.html" %}
{% block title %}Регистрация — Альфа Защита{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="page-heading"><h1>Регистрация</h1></div>
    <div class="panel">
        <form method="post" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit">Зарегистрироваться</button>
        </form>
    </div>
    <p>После регистрации войдите в аккаунт. <a href="{% url 'accounts:login' %}">Перейти ко входу</a></p>
</div>
{% endblock %}
