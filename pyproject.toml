[project]
name = "alfa-protection"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv==1.2.3",
    "Pillow==12.3.0",
    "gunicorn==26.2.0",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django>=4.11,<5",
]
ml = [
    "torch==2.12.1",
    "transformers==5.16.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
