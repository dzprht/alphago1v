[project]
name = "alfa-protection"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv==1.2.3",
    "Pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "catboost==1.2.10",
    "tldextract==5.4.0",
    "idna==3.20",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django>=4.11,<5",
]
ml = [
    "torch==2.11.0",
    "transformers==5.16.1",
]
whisper = [
    "faster-whisper==1.2.1",
]
media = [
    {include-group = "whisper"},
    "pyannote.audio==4.0.7",
    "easyocr==1.7.2",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "torchcodec==0.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
